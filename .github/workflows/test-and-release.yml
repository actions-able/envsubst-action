name: test-and-release

on:
  push:
    branches:
      - main
  workflow_dispatch:
  pull_request:

permissions: read-all

jobs:
  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@just

      - name: docker-build
        run: just docker-build

  test-action-with-input-file:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Alway 0 to be sure to fetch all your files

      - name: Run envsubst
        uses: ./
        with:
          working-directory: "tests"
          input-file: "input.txt"
          output-file: "output.txt"
        env:
          FOO: "world"

      - name: display output
        run: cat ./tests/output.txt
        shell: bash

      - name: test-file-content
        run: '[[ "$(cat ./tests/output.txt)" = "Hello world" ]]'
        shell: bash

  test-action-with-input-pattern:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Alway 0 to be sure to fetch all your files

      - name: Run envsubst
        uses: ./
        with:
          working-directory: "tests"
          input-file-pattern: "*.txt"
          output-file-suffix: ".out"
        env:
          FOO: "world"

      - name: display output
        run: |
          pwd
          ls -l
          ls -l tests
          cat ./tests/input.txt.out
        shell: bash

      - name: test-file-content
        run: '[[ "$(cat ./tests/input.txt.out)" = "Hello world" ]]'
        shell: bash

  test-entrypoint-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: taiki-e/install-action@just

      - name: test-entrypoint
        run: just tests
        shell: bash

  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.ref }}-${{ github.event_name }}
    permissions:
      contents: write
      pull-requests: write
    needs:
      - docker-build
      - test-action-with-input-file
      - test-action-with-input-pattern
      - test-entrypoint-script
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please-config.json
          manifest-file: .github/.release-please-manifest.json

      - name: Checkout repository
        if: ${{ steps.release.outputs.release_created == 'true' }}
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update major and minor version tags
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          MAJOR: ${{ steps.release.outputs.major }}
          MINOR: ${{ steps.release.outputs.minor }}
          TAG: ${{ steps.release.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "v${MAJOR}" "${TAG}"
          git tag -f "v${MAJOR}.${MINOR}" "${TAG}"
          git push origin "v${MAJOR}" --force
          git push origin "v${MAJOR}.${MINOR}" --force
